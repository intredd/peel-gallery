<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peel Gallery</title>
    <meta
      name="description"
      content="Infinite horizontal gallery with a column peel — scale map tuned live."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fragment+Mono:wght@400&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="intro">
        <p class="meta">demo project</p>
        <h1 class="title">Peel Gallery</h1>
        <p class="lede">
          <span class="lede__desk"
            >Infinite strip with a live WebGL peel — full scale in the center,
            falloff on the sides. Tune the scale map (top right).</span
          >
          <span class="lede__mob">Shelf peel — drag the strip.</span>
        </p>
      </header>

      <div class="gallery-shell" data-peel-root>
        <div class="gallery" data-gallery-scroller>
          <div class="gallery__track" data-peel-track>
            <figure class="shot shot--1">
              <img
                class="shot__photo"
                src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&w=1200&q=85"
                alt=""
                crossorigin="anonymous"
                decoding="async"
                style="object-position: 50% 42%"
              />
              <span class="shot__index" data-peel-text>01</span>
              <figcaption class="shot__cap" data-peel-text>Arched hall</figcaption>
            </figure>
            <figure class="shot shot--2">
              <img
                class="shot__photo"
                src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&w=1200&q=85"
                alt=""
                crossorigin="anonymous"
                decoding="async"
                style="object-position: 50% 55%"
              />
              <span class="shot__index" data-peel-text>02</span>
              <figcaption class="shot__cap" data-peel-text>Glass office</figcaption>
            </figure>
            <figure class="shot shot--3">
              <img
                class="shot__photo"
                src="https://images.unsplash.com/photo-1560448204-603b3fc33ddc?auto=format&w=1200&q=85"
                alt=""
                crossorigin="anonymous"
                decoding="async"
                style="object-position: 50% 45%"
              />
              <span class="shot__index" data-peel-text>03</span>
              <figcaption class="shot__cap" data-peel-text>Linen suite</figcaption>
            </figure>
            <figure class="shot shot--4">
              <img
                class="shot__photo"
                src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&w=1200&q=85"
                alt=""
                crossorigin="anonymous"
                decoding="async"
                style="object-position: 50% 38%"
              />
              <span class="shot__index" data-peel-text>04</span>
              <figcaption class="shot__cap" data-peel-text>Rooftop pool</figcaption>
            </figure>
            <figure class="shot shot--5">
              <img
                class="shot__photo"
                src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&w=1200&q=85"
                alt=""
                crossorigin="anonymous"
                decoding="async"
                style="object-position: 50% 62%"
              />
              <span class="shot__index" data-peel-text>05</span>
              <figcaption class="shot__cap" data-peel-text>Evening pool</figcaption>
            </figure>
            <figure class="shot shot--6">
              <img
                class="shot__photo"
                src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&w=1200&q=85"
                alt=""
                crossorigin="anonymous"
                decoding="async"
                style="object-position: 50% 40%"
              />
              <span class="shot__index" data-peel-text>06</span>
              <figcaption class="shot__cap" data-peel-text>Grey lounge</figcaption>
            </figure>
          </div>
        </div>
      </div>

      <p class="hint">Drag · click a card to center it</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
